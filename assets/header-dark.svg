
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Victor Hugo — Desenvolvedor Full Stack">

  <defs>
    <!-- Grade de fundo -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24202A" stroke-width="1"/>
    </pattern>

    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>

    <mask id="fade">
      <rect width="1200" height="320" fill="url(#fadeGrad)"/>
    </mask>

    <!-- Brilho vermelho suave do fundo -->
    <radialGradient id="glowA" cx="82%" cy="15%" r="55%">
      <stop offset="0" stop-color="#FF1744" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="5%" cy="100%" r="50%">
      <stop offset="0" stop-color="#FF1744" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente vermelho da barra -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1744"/>
      <stop offset="1" stop-color="#FF0033"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
    }

    .l { animation: in .35s ease both; }

    .d1 { animation-delay: .3s; }
    .d2 { animation-delay: .9s; }
    .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 2.1s; }
    .d5 { animation-delay: 2.7s; }
    .d6 { animation-delay: 3.3s; }

    @keyframes in {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: none; }
    }

    .cur { animation: blink 1s step-end infinite; }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .scan { animation: scan 7s linear infinite; }

    @keyframes scan {
      from { transform: translateY(-20px); }
      to { transform: translateY(340px); }
    }
  </style>

  <!-- FUNDO -->
  <rect width="1200" height="320" fill="#0B0E14"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#fade)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>

  <!-- Linha animada -->
  <rect class="scan" x="0" y="0" width="1200" height="2"
        fill="#FF1744" opacity=".2"/>

  <!-- APRESENTAÇÃO — LADO ESQUERDO -->
  <g class="mono">

    <text x="60" y="98" font-size="15" fill="#FF1744">// full-stack · software engineering</text>

    <text x="58" y="158" font-size="52"
          font-weight="700" fill="#E6EDF3"
          letter-spacing="-1">Victor Hugo</text>

    <text x="60" y="198" font-size="21" fill="#8B95A8">
      Desenvolvedor Full Stack
    </text>

    <!-- Barra vermelha fina -->
    <rect x="60" y="218" width="140" height="2"
          rx="1" fill="url(#accent)"/>

    <!-- TECNOLOGIAS -->
    <g font-size="13" fill="#B8C3D6">

      <rect x="60" y="246" width="96" height="28" rx="6"
            fill="#111726" stroke="#FF1744" stroke-opacity=".85"/>
      <text x="108" y="265" text-anchor="middle">Node.js</text>

      <rect x="166" y="246" width="84" height="28" rx="6"
            fill="#111726" stroke="#FF1744" stroke-opacity=".85"/>
      <text x="208" y="265" text-anchor="middle">Next.js</text>

      <rect x="260" y="246" width="96" height="28" rx="6"
            fill="#111726" stroke="#FF1744" stroke-opacity=".85"/>
      <text x="308" y="265" text-anchor="middle">Firebase</text>

      <rect x="366" y="246" width="76" height="28" rx="6"
            fill="#111726" stroke="#FF1744" stroke-opacity=".85"/>
      <text x="404" y="265" text-anchor="middle">MySQL</text>

      <rect x="452" y="246" width="76" height="28" rx="6"
            fill="#111726" stroke="#FF1744" stroke-opacity=".85"/>
      <text x="490" y="265" text-anchor="middle">Vitest</text>

    </g>
  </g>

  <!-- TERMINAL — LADO DIREITO -->
  <g class="mono">

    <rect x="690" y="44" width="456" height="240" rx="12"
          fill="#0F1420" stroke="#FF1744" stroke-width="1.2"/>

    <path d="M690 56a12 12 0 0 1 12-12h432a12 12 0 0 1 12 12v18H690z"
          fill="#141A28"/>

    <!-- Bolinhas clássicas do terminal -->
    <circle cx="712" cy="60" r="5.5" fill="#FF5F57"/>
    <circle cx="730" cy="60" r="5.5" fill="#FEBC2E"/>
    <circle cx="748" cy="60" r="5.5" fill="#28C840"/>

    <text x="918" y="64" font-size="12"
          fill="#8B95A8" text-anchor="middle">victor@dev: ~</text>

    <g font-size="12.5">

      <!-- Identificação -->
      <g class="l d1">
        <text x="712" y="99" fill="#FF1744">$</text>
        <text x="728" y="99" fill="#E6EDF3">whoami</text>
      </g>

      <g class="l d2">
        <text x="712" y="120" fill="#8B95A8">victor-hugo · desenvolvedor de software</text>
        <text x="712" y="138" fill="#8B95A8">engenharia de software (em andamento)</text>
      </g>

      <!-- Projetos -->
      <g class="l d3">
        <text x="712" y="164" fill="#FF1744">$</text>
        <text x="728" y="164" fill="#E6EDF3">ls projetos/</text>
      </g>

      <g class="l d4">

        <!-- NexCall -->
        <text x="712" y="184" fill="#FF1744">nexcall/</text>
        <text x="805" y="184" fill="#8B95A8">telefonia · APIs · discador</text>

        <!-- E-commerce -->
        <text x="712" y="202" fill="#FF1744">ecommerce-platform/</text>
        <text x="875" y="202" fill="#8B95A8">firebase · vite · admin</text>

        <!-- Landing Pages -->
        <text x="712" y="220" fill="#FF1744">landing-pages/</text>
        <text x="830" y="220" fill="#8B95A8">HTML · CSS · hosting</text>

      </g>

      <!-- Ambiente -->
      <g class="l d5">
        <text x="712" y="246" fill="#FF1744">$</text>
        <text x="728" y="246" fill="#E6EDF3">uname -s</text>
      </g>

      <g class="l d6">
        <text x="712" y="266" fill="#8B95A8">Linux · Windows</text>
        <text x="838" y="266" fill="#FF1744" class="cur">▌</text>
      </g>

    </g>
  </g>

  <!-- LINHA INFERIOR -->
  <rect x="0" y="315" width="1200" height="1"
        fill="#FF1744" opacity=".65"/>

</svg>
